<script>
// 平台 SDK 按域名条件加载（独立运行时完全不加载，游戏行为不变）
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#15171e; color:#e8e6df;
    font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; }

  #menu { flex:1; width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; overflow-y:auto; padding:4px 14px 8px; min-height:0; }

    background:rgba(12,14,19,.78); border-radius:10px; z-index:5; }

    display:flex; align-items:center; justify-content:center; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:pointer; }
  .padb:active { background:#ffb63d; color:#1d1409; }
  #padUp { grid-column:2; grid-row:1; } #padLeft { grid-column:1; grid-row:2; }
  #padRight { grid-column:3; grid-row:2; } #padDown { grid-column:2; grid-row:3; }
  #footer { color:#5b6270; font-size:11px; padding:5px 0 10px; text-align:center; }
  @media (hover:hover) and (pointer:fine) { #dpad { display:none; } }
</style>

<body>
<div id="wrap">
  <header id="topbar">
    <div id="logo">SOKOBAN PUSH</div>
    <button class="sbtn" id="sndBtn">SOUND ON</button>
  </header>

  <!-- 关卡选择界面 -->
  <section id="menu">
    <div id="menuHead">
      <h1>Select Level</h1>
      <div id="starTotal">&#9733; 0 / 36</div>
    </div>
    <div id="grid"></div>
    <p id="hint">Arrow keys / WASD to move &middot; U undo &middot; R restart<br>On mobile: swipe the board or use the pad below.</p>
  </section>

  <!-- 游戏界面 -->
  <section id="play" style="display:none">
    <div id="hud">
      <div class="stat"><div class="label">LEVEL</div><div class="val" id="hLevel">1/12</div></div>
      <div class="stat"><div class="label">MOVES</div><div class="val" id="hMoves">0</div></div>
      <div class="stat"><div class="label">PUSHES</div><div class="val" id="hPushes">0</div></div>
      <div class="stat"><div class="label">PAR</div><div class="val" id="hPar">-</div></div>
    </div>
    <div id="lvlName">First Push</div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay"><div id="panel">
        <h2 id="winTitle">Level Complete!</h2>
        <div id="winStars">&#9733;&#9733;&#9733;</div>
        <p id="winInfo">Moves 0</p>
        <p id="winBest"></p>
        <div id="winBtns">
          <button class="pbtn" id="nextBtn">NEXT</button>
          <button class="pbtn dim" id="retryBtn">RETRY</button>
          <button class="pbtn dim" id="toMenuBtn">LEVELS</button>
        </div>
      </div></div>
    </div>
    <div id="btnRow">
      <button class="sbtn" id="undoBtn">UNDO (U)</button>
      <button class="sbtn" id="restartBtn">RESTART (R)</button>
      <button class="sbtn" id="menuBtn">LEVELS</button>
    </div>
    <div id="dpad">
      <div class="padb" id="padUp">&#9650;</div>
      <div class="padb" id="padLeft">&#9664;</div>
      <div class="padb" id="padRight">&#9654;</div>
      <div class="padb" id="padDown">&#9660;</div>
    </div>
  </section>

  <footer id="footer">Sokoban Push &mdash; a free warehouse puzzle game</footer>
</div>

<script>
"use strict";
/* CORE-BEGIN */
// ======================= 纯逻辑核心（无 DOM 依赖，可被 Node 测试脚本提取验证） =======================
// 关卡图例：# 墙   @ 玩家   $ 箱子   . 目标   * 箱子在目标上   + 玩家在目标上   空格 地板
// 12 关手工设计：1-4 教学，5-8 中等，9-12 需要规划推动顺序。par 为参考步数（3 星线）。
var SP_LEVELS = [
  { name: "First Push", par: 4, rows: [
    "#######",
    "#     #",
    "#  $. #",
    "#  @  #",
    "#######"
  ]},
  { name: "Corner Turn", par: 7, rows: [
    "########",
    "#      #",
    "#      #",
    "#  $   #",
    "# @ .  #",
    "########"
  ]},
  { name: "Two Towers", par: 9, rows: [
    "########",
    "#  @   #",
    "# $$   #",
    "#      #",
    "# ..   #",
    "#      #",
    "########"
  ]},
  { name: "Around the Wall", par: 12, rows: [
    "#########",
    "#       #",
    "# .$    #",
    "#  # $@ #",
    "#  .    #",
    "#       #",
    "#########"
  ]},
  { name: "Mind the Order", par: 24, rows: [
    "#########",
    "#       #",
    "# .#  $ #",
    "#  $ @  #",
    "#  #.   #",
    "#       #",
    "#########"
  ]},
  { name: "Three in a Row", par: 17, rows: [
    "#########",
    "#   @   #",
    "#  $$$  #",
    "#       #",
    "#  ...  #",
    "#       #",
    "#########"
  ]},
  { name: "The Pillars", par: 19, rows: [
    "#########",
    "#   @   #",
    "#  $$$  #",
    "# .#.#  #",
    "#   .   #",
    "#       #",
    "#########"
  ]},
  { name: "The Funnel", par: 30, rows: [
    "##########",
    "#    @   #",
    "#  $ $   #",
    "#    $   #",
    "#  $     #",
    "#  ....  #",
    "##########"
  ]},
  { name: "Loading Bay", par: 43, rows: [
    "###########",
    "#         #",
    "# $ $ $ $ #",
    "#   @     #",
    "#  .  .   #",
    "#  .  .   #",
    "#         #",
    "###########"
  ]},
  { name: "Store Room", par: 80, rows: [
    "###########",
    "#     #   #",
    "# $$$ #...#",
    "#     #   #",
    "#  @      #",
    "#     #   #",
    "###########"
  ]},
  { name: "Cross-Dock", par: 90, rows: [
    "###########",
    "#    #    #",
    "# $$ # .. #",
    "#  $ # .. #",
    "#  $      #",
    "#@        #",
    "###########"
  ]},
  { name: "Grand Depot", par: 118, rows: [
    "###########",
    "#     #   #",
    "# $$$ #...#",
    "#    @    #",
    "# $$  #   #",
    "#     #. .#",
    "###########"
  ]}
];

var SP_DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

// 解析关卡字符串 -> 状态对象（walls/goals/goalSet/dead 为共享只读引用，boxes 每步复制）
function spParse(def) {
  var rows = def.rows, h = rows.length, w = 0, y, x;
  for (y = 0; y < h; y++) if (rows[y].length > w) w = rows[y].length;
  var walls = new Array(w * h), goals = [], boxes = [], goalSet = {}, px = 0, py = 0;
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
    var ch = x < rows[y].length ? rows[y].charAt(x) : " ";
    var i = y * w + x;
    walls[i] = ch === "#" ? 1 : 0;
    if (ch === "." || ch === "*" || ch === "+") { goals.push(i); goalSet[i] = true; }
    if (ch === "$" || ch === "*") boxes.push(i);
    if (ch === "@" || ch === "+") { px = x; py = y; }
  }
  var p = { w:w, h:h, walls:walls, goals:goals, goalSet:goalSet, boxes:boxes, px:px, py:py,
            moves:0, pushes:0, dead:spDeadSquares(w, h, walls, goals) };
  return p;
}

// 简单死锁格检测：从目标出发按“拉”反推；箱子推进非活格后永远无法再到达任何目标
function spDeadSquares(w, h, walls, goals) {
  var live = new Array(w * h), i, queue = [];
  for (i = 0; i < w * h; i++) live[i] = false;
  for (i = 0; i < goals.length; i++) { live[goals[i]] = true; queue.push(goals[i]); }
  var DX = [1, -1, 0, 0], DY = [0, 0, 1, -1];
  while (queue.length) {
    var c = queue.pop(), cx = c % w, cy = (c - cx) / w, d;
    for (d = 0; d < 4; d++) {
      // 反向：箱子从 A=c-D 被推到 c，需要玩家站在 A-D
      var ax = cx - DX[d], ay = cy - DY[d];
      var axx = cx - 2 * DX[d], ayy = cy - 2 * DY[d];
      if (ax < 0 || ay < 0 || ax >= w || ay >= h || axx < 0 || ayy < 0 || axx >= w || ayy >= h) continue;
      var ai = ay * w + ax, pi = ayy * w + axx;
      if (!walls[ai] && !walls[pi] && !live[ai]) { live[ai] = true; queue.push(ai); }
    }
  }
  var dead = new Array(w * h);
  for (i = 0; i < w * h; i++) dead[i] = !live[i];
  return dead;
}

// 尝试一步：返回 null 表示拒绝（撞墙/推不动/推入箱）；否则返回 { st 新状态, pushed 被推箱子槽位 }
// 规则：人一次走一格；推箱一次一格；箱子不能拉；推入墙或另一箱则拒绝。
function spTryMove(p, dx, dy) {
  var w = p.w, nx = p.px + dx, ny = p.py + dy, ni;
  if (nx < 0 || ny < 0 || nx >= w || ny >= p.h) return null;
  ni = ny * w + nx;
  if (p.walls[ni]) return null;
  var bi = p.boxes.indexOf(ni), pushed = -1, bni = -1;
  if (bi >= 0) {
    var bx = nx + dx, by = ny + dy;
    if (bx < 0 || by < 0 || bx >= w || by >= p.h) return null;
    bni = by * w + bx;
    if (p.walls[bni] || p.boxes.indexOf(bni) >= 0) return null;
    pushed = bi;
  }
  var boxes = p.boxes.slice();
  if (pushed >= 0) boxes[pushed] = bni;
  return { pushed: pushed,
           st: { w:w, h:p.h, walls:p.walls, goals:p.goals, goalSet:p.goalSet, dead:p.dead,
                 px:nx, py:ny, boxes:boxes,
                 moves:p.moves + 1, pushes:p.pushes + (pushed >= 0 ? 1 : 0) } };
}

function spIsWin(p) {
  for (var i = 0; i < p.boxes.length; i++) if (!p.goalSet[p.boxes[i]]) return false;
  return true;
}

// 星级：<=par 3 星；<=ceil(par*1.5) 2 星；其余 1 星
function spStars(moves, par) {
  return moves <= par ? 3 : moves <= Math.ceil(par * 1.5) ? 2 : 1;
}
/* CORE-END */

// ======================= 浏览器部分：渲染 / 输入 / 音效 / 存档 =======================
function $(id) { return document.getElementById(id); }

var canvas = $("game"), ctx = canvas.getContext("2d");
var dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
var cell = 40;

// —— 存档（localStorage 全部 try/catch 包裹，隐私模式下降级为内存，不影响游戏）——
var save = { unlocked: 1, best: {}, muted: false };
(function () {
  try {
    var raw = localStorage.getItem("sokoban_push_v1");
    if (raw) {
      var d = JSON.parse(raw);
      if (d && typeof d === "object") {
        if (typeof d.unlocked === "number" && d.unlocked >= 1) save.unlocked = Math.min(SP_LEVELS.length, d.unlocked | 0);
        if (d.best && typeof d.best === "object") save.best = d.best;
        if (typeof d.muted === "boolean") save.muted = d.muted;
      }
    }
  } catch (e) {}
})();
function persist() { try { localStorage.setItem("sokoban_push_v1", JSON.stringify(save)); } catch (e) {} }

// —— WebAudio 合成音效（无任何外部资源）——
var actx = null;
function tone(f0, f1, dur, type, gainv, delay) {
  if (save.muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    var t0 = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(gainv || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
var SFX = {
  step:   function () { tone(170, 140, 0.05, "triangle", 0.05); },
  push:   function () { tone(95, 60, 0.12, "sawtooth", 0.09); },
  goal:   function () { tone(620, 620, 0.08, "sine", 0.1); tone(930, 930, 0.14, "sine", 0.09, 0.08); },
  reject: function () { tone(80, 65, 0.12, "square", 0.06); },
  undo:   function () { tone(330, 220, 0.08, "triangle", 0.05); },
  click:  function () { tone(520, 520, 0.04, "sine", 0.05); },
  win:    function () { tone(523, 523, 0.12, "triangle", 0.09); tone(659, 659, 0.12, "triangle", 0.09, 0.1);
                        tone(784, 784, 0.12, "triangle", 0.09, 0.2); tone(1047, 1047, 0.3, "triangle", 0.1, 0.3); }
};

// —— 运行时状态 ——
var view = "menu";           // menu | play
var cur = null;              // { idx, par, name, p0, st, history[], won }
var vis = null;              // 视觉插值 { px, py, boxes[{x,y,sq,ax}], dir, bump, bumpDX, bumpDY }
var particles = [];
var lastMoveAt = 0;
var COOLDOWN = 90;

function cellOf(p0, i) { return { x: i % p0.w, y: Math.floor(i / p0.w), sq: 0, ax: 0 }; }

function freshState() {
  var p0 = cur.p0;
  return { w: p0.w, h: p0.h, walls: p0.walls, goals: p0.goals, goalSet: p0.goalSet, dead: p0.dead,
           px: p0.px, py: p0.py, boxes: p0.boxes.slice(), moves: 0, pushes: 0 };
}

function enterLevel(idx) {
  var def = SP_LEVELS[idx];
  cur = { idx: idx, par: def.par, name: def.name, p0: spParse(def), st: null, history: [], won: false };
  restartLevel(false);
  showView("play");
  $("hPar").textContent = def.par;
  $("lvlName").textContent = (idx + 1) + ". " + def.name;
  // 平台埋点：开始游玩（SDK 仅在对应域名加载）
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK)
      window.CrazyGames.SDK.game.gameplayStart();
  } catch (e) {}
}

function restartLevel(sound) {
  cur.st = freshState();
  cur.history = [];
  cur.won = false;
  vis = { px: cur.st.px, py: cur.st.py, boxes: [], dir: [0, 1], bump: 0, bumpDX: 0, bumpDY: 0 };
  for (var i = 0; i < cur.st.boxes.length; i++) vis.boxes.push(cellOf(cur.p0, cur.st.boxes[i]));
  $("overlay").style.display = "none";
  particles = [];
  updateHUD();
  if (sound) SFX.click();
}

function doMove(dir) {
  if (view !== "play" || !cur || cur.won) return;
  var d = SP_DIRS[dir];
  if (!d) return;
  var t = Date.now();
  if (t - lastMoveAt < COOLDOWN) return;
  lastMoveAt = t;
  var res = spTryMove(cur.st, d[0], d[1]);
  if (!res) { // 拒绝：撞墙 / 推入墙 / 推入另一箱
    vis.bump = 1; vis.bumpDX = d[0]; vis.bumpDY = d[1];
    SFX.reject();
    return;
  }
  cur.history.push(cur.st);   // 只有成功落子才入撤销栈
  var pushed = res.pushed, landed = false, bx = 0, by = 0;
  if (pushed >= 0) {
    var b = vis.boxes[pushed];
    b.sq = 1; b.ax = d[0] !== 0 ? 0 : 1;   // 沿推动方向挤压
    landed = !!cur.p0.goalSet[res.st.boxes[pushed]];
    bx = b.x; by = b.y;
  }
  cur.st = res.st;
  vis.dir = [d[0], d[1]];
  if (pushed >= 0) {
    if (landed) { SFX.goal(); goalBurst(bx + 0.5, by + 0.5); } else SFX.push();
  } else SFX.step();
  updateHUD();
  if (spIsWin(cur.st)) onWin();
}

function doUndo() {
  if (view !== "play" || !cur || cur.won || !cur.history.length) return;
  cur.st = cur.history.pop();
  vis.px = cur.st.px; vis.py = cur.st.py; vis.bump = 0;
  vis.boxes = [];
  for (var i = 0; i < cur.st.boxes.length; i++) vis.boxes.push(cellOf(cur.p0, cur.st.boxes[i]));
  SFX.undo();
  updateHUD();
}

function onWin() {
  cur.won = true;
  var moves = cur.st.moves, stars = spStars(moves, cur.par), idx1 = cur.idx + 1;
  var rec = save.best[idx1] || { moves: 0, stars: 0 };
  var newBest = !rec.moves || moves < rec.moves;
  if (newBest) rec.moves = moves;
  if (stars > rec.stars) rec.stars = stars;
  save.best[idx1] = rec;
  if (idx1 + 1 > save.unlocked && idx1 + 1 <= SP_LEVELS.length) save.unlocked = idx1 + 1; // 解锁下一关
  persist();
  // 平台埋点：一关结束
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStop();
      window.CrazyGames.SDK.game.happytime();
    }
  } catch (e) {}
  SFX.win();
  winBurst();
  setTimeout(function () { showWinPanel(stars, moves, newBest); }, 550);
}

function showWinPanel(stars, moves, newBest) {
  var last = cur.idx === SP_LEVELS.length - 1;
  $("winTitle").textContent = last ? "All Levels Clear!" : "Level Complete!";
  var s = "";
  for (var k = 0; k < 3; k++) s += k < stars ? "\u2605" : "\u2606";
  $("winStars").textContent = s;
  var rec = save.best[cur.idx + 1];
  $("winInfo").textContent = "Moves " + moves + " \u00b7 Par " + cur.par + " \u00b7 Best " + (rec ? rec.moves : moves);
  $("winBest").textContent = newBest ? "New record!" : "";
  $("nextBtn").style.display = last ? "none" : "inline-block";
  $("overlay").style.display = "flex";
}

function nextOrMenu() {
  if (!cur || !cur.won) return;
  if (cur.idx >= SP_LEVELS.length - 1) gotoMenu();
  else { SFX.click(); enterLevel(cur.idx + 1); }
}

function gotoMenu() {
  // 若中途退出，结束游玩埋点
  try {
    if (cur && !cur.won && window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK)
      window.CrazyGames.SDK.game.gameplayStop();
  } catch (e) {}
  cur = null;
  buildMenu();
  showView("menu");
}

function updateHUD() {
  $("hLevel").textContent = (cur.idx + 1) + "/" + SP_LEVELS.length;
  $("hMoves").textContent = cur.st.moves;
  $("hPushes").textContent = cur.st.pushes;
}

// —— 界面切换 ——
function showView(v) {
  view = v;
  $("menu").style.display = v === "menu" ? "flex" : "none";
  $("play").style.display = v === "play" ? "flex" : "none";
  if (v === "play") fitCanvas();
}

function buildMenu() {
  var g = $("grid");
  g.innerHTML = "";
  var total = 0, i, k;
  for (i = 0; i < SP_LEVELS.length; i++) {
    var rec = save.best[i + 1];
    if (rec) total += rec.stars || 0;
    var btn = document.createElement("button");
    var locked = (i + 1) > save.unlocked;
    btn.className = "lvl" + (locked ? " locked" : "");
    if (locked) {
      btn.disabled = true;
      btn.innerHTML = "<div class='num'>" + (i + 1) + "</div><div class='nm'>&#128274; Locked</div><div class='meta'>Clear level " + i + "</div>";
    } else {
      var stars = rec ? rec.stars : 0, s = "";
      for (k = 0; k < 3; k++) s += k < stars ? "\u2605" : "\u2606";
      var meta = rec ? "Best " + rec.moves : "Par " + SP_LEVELS[i].par;
      btn.innerHTML = "<div class='num'>" + (i + 1) + "</div><div class='nm'>" + SP_LEVELS[i].name +
                      "</div><div class='meta'><span class='st'>" + s + "</span> " + meta + "</div>";
      (function (ii) {
        btn.addEventListener("click", function () { SFX.click(); enterLevel(ii); });
      })(i);
    }
    g.appendChild(btn);
  }
  $("starTotal").innerHTML = "&#9733; " + total + " / " + (SP_LEVELS.length * 3);
}

// —— canvas 自适应 ——
function fitCanvas() {
  if (!cur) return;
  var p = cur.p0;
  // 注意：不能用 #stage 的宽度（它由 canvas 自身尺寸决定，会自锁在初始 300px），
  // 用稳定的外层容器 #play 计算可用宽度。
  var playEl = $("play");
  var availW = Math.min((playEl.clientWidth || window.innerWidth - 20) - 8, 620);
  if (availW < 200) availW = 200;
  var top = $("stage").getBoundingClientRect().top;
  var dpadH = $("dpad").offsetHeight > 0 ? $("dpad").offsetHeight + 6 : 0;
  var btnH = $("btnRow").offsetHeight + 4;
  var availH = window.innerHeight - top - dpadH - btnH - 12;
  if (availH < 160) availH = 160;
  var cs = Math.floor(Math.min(availW / p.w, availH / p.h));
  if (cs < 16) cs = 16;
  if (cs > 58) cs = 58;
  cell = cs;
  var W = cs * p.w, H = cs * p.h;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// —— 特效粒子 ——
function burst(cx, cy, color, n) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 110;
    particles.push({ x: cx * cell, y: cy * cell, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50,
                     life: 0.4 + Math.random() * 0.3, color: color, size: 2 + Math.random() * 3 });
  }
}
function goalBurst(cx, cy) { burst(cx, cy, "#ffb63d", 10); }
function winBurst() {
  var w = cur.p0.w;
  for (var i = 0; i < cur.st.boxes.length; i++) {
    var b = cur.st.boxes[i];
    burst((b % w) + 0.5, Math.floor(b / w) + 0.5, i % 2 ? "#ffd76a" : "#7fd67f", 12);
  }
}

// —— 渲染 ——
function hash2(x, y) {
  var n = (x * 374761393 + y * 668265263) | 0;
  n = ((n ^ (n >> 13)) * 1274126177) | 0;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawFloor(x, y) {
  var px = x * cell, py = y * cell;
  ctx.fillStyle = (x + y) % 2 ? "#41475380" : "#00000000";
  ctx.fillStyle = (x + y) % 2 ? "#464c58" : "#40464f";
  ctx.fillRect(px, py, cell, cell);
  ctx.strokeStyle = "rgba(0,0,0,.14)";
  ctx.strokeRect(px + 0.5, py + 0.5, cell - 1, cell - 1);
  var hv = hash2(x, y);
  if (hv > 0.82) { ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(px + cell * 0.6, py + cell * 0.3, cell * 0.16, cell * 0.1); }
  if (hv < 0.07) { ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(px + cell * 0.25, py + cell * 0.55, cell * 0.2, cell * 0.12); }
}

function drawWall(x, y) {
  var px = x * cell, py = y * cell;
  var tint = hash2(x * 3, y * 5);
  ctx.fillStyle = tint > 0.5 ? "#262c38" : "#242a35";
  ctx.fillRect(px, py, cell, cell);
  // 砖缝
  ctx.strokeStyle = "rgba(0,0,0,.4)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py + cell / 3 + 0.5); ctx.lineTo(px + cell, py + cell / 3 + 0.5);
  ctx.moveTo(px, py + 2 * cell / 3 + 0.5); ctx.lineTo(px + cell, py + 2 * cell / 3 + 0.5);
  var off1 = (y % 2 ? cell * 0.25 : cell * 0.75), off2 = (y % 2 ? cell * 0.75 : cell * 0.25);
  ctx.moveTo(px + off1, py + 0.5); ctx.lineTo(px + off1, py + cell / 3);
  ctx.moveTo(px + off2, py + cell / 3); ctx.lineTo(px + off2, py + 2 * cell / 3);
  ctx.moveTo(px + off1, py + 2 * cell / 3); ctx.lineTo(px + off1, py + cell);
  ctx.stroke();
  // 与地板相接的边缘光影
  var p0 = cur.p0;
  if (y + 1 < p0.h && !p0.walls[(y + 1) * p0.w + x]) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(px, py + cell - 3, cell, 3); }
  if (y - 1 >= 0 && !p0.walls[(y - 1) * p0.w + x]) { ctx.fillStyle = "rgba(255,255,255,.09)"; ctx.fillRect(px, py, cell, 2); }
}

function drawGoal(x, y, time) {
  var px = x * cell, py = y * cell;
  var pulse = 0.5 + 0.35 * Math.sin(time * 3 + x * 1.7 + y * 2.3);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = "#ffb63d";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#ffb63d";
  ctx.shadowBlur = 9;
  ctx.strokeRect(px + 5, py + 5, cell - 10, cell - 10);
  ctx.beginPath(); // 内部菱形标记
  ctx.moveTo(px + cell / 2, py + cell * 0.28);
  ctx.lineTo(px + cell * 0.72, py + cell / 2);
  ctx.lineTo(px + cell / 2, py + cell * 0.72);
  ctx.lineTo(px + cell * 0.28, py + cell / 2);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawBox(i, time) {
  var b = vis.boxes[i];
  var onGoal = !!cur.p0.goalSet[cur.st.boxes[i]];
  var px = b.x * cell, py = b.y * cell;
  var s = cell * 0.86;
  ctx.save();
  ctx.translate(px + cell / 2, py + cell / 2);
  var sqX = b.ax === 0 ? b.sq : 0, sqY = b.ax === 1 ? b.sq : 0;
  ctx.scale(1 - 0.2 * sqX + 0.1 * sqY, 1 - 0.2 * sqY + 0.1 * sqX);
  if (onGoal) { ctx.shadowColor = "#6ed06e"; ctx.shadowBlur = 12; }
  // 箱体（木板渐变）
  var g = ctx.createLinearGradient(0, -s / 2, 0, s / 2);
  g.addColorStop(0, onGoal ? "#c2904c" : "#b3813f");
  g.addColorStop(1, onGoal ? "#96682c" : "#8a5c26");
  ctx.fillStyle = g;
  roundRect(ctx, -s / 2, -s / 2, s, s, 3);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2;
  ctx.strokeStyle = onGoal ? "#6ed06e" : "#5f3f18";
  roundRect(ctx, -s / 2, -s / 2, s, s, 3);
  ctx.stroke();
  // 木板竖缝 + X 交叉加固条
  ctx.strokeStyle = "rgba(60,35,10,.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-s / 6, -s / 2 + 2); ctx.lineTo(-s / 6, s / 2 - 2);
  ctx.moveTo(s / 6, -s / 2 + 2); ctx.lineTo(s / 6, s / 2 - 2);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-s / 2 + 4, -s / 2 + 4); ctx.lineTo(s / 2 - 4, s / 2 - 4);
  ctx.moveTo(s / 2 - 4, -s / 2 + 4); ctx.lineTo(-s / 2 + 4, s / 2 - 4);
  ctx.stroke();
  // 角部铆钉
  ctx.fillStyle = "#4a3010";
  var n = Math.max(1.5, cell * 0.045);
  ctx.fillRect(-s / 2 + 3, -s / 2 + 3, n, n); ctx.fillRect(s / 2 - 3 - n, -s / 2 + 3, n, n);
  ctx.fillRect(-s / 2 + 3, s / 2 - 3 - n, n, n); ctx.fillRect(s / 2 - 3 - n, s / 2 - 3 - n, n, n);
  // 叉车货叉印记（底部两条深色叉槽）
  ctx.fillStyle = "rgba(35,20,5,.55)";
  ctx.fillRect(-s * 0.36, s / 2 - cell * 0.14, s * 0.3, Math.max(2, cell * 0.07));
  ctx.fillRect(s * 0.06, s / 2 - cell * 0.14, s * 0.3, Math.max(2, cell * 0.07));
  ctx.restore();
}

function drawPlayer(time) {
  var p0 = cur.p0;
  var ox = 0, oy = 0;
  if (vis.bump > 0) { // 拒绝时的碰撞回弹
    var k = Math.sin(vis.bump * Math.PI) * 0.16 * cell;
    ox = vis.bumpDX * k; oy = vis.bumpDY * k;
  }
  var cx = (vis.px + 0.5) * cell + ox, cy = (vis.py + 0.5) * cell + oy;
  ctx.save();
  ctx.translate(cx, cy);
  // 影子
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(0, cell * 0.34, cell * 0.3, cell * 0.09, 0, 0, Math.PI * 2);
  ctx.fill();
  // 身体（工装蓝）
  ctx.fillStyle = "#4a79c9";
  roundRect(ctx, -cell * 0.26, -cell * 0.06, cell * 0.52, cell * 0.4, cell * 0.12);
  ctx.fill();
  // 背带
  ctx.strokeStyle = "#33517f";
  ctx.lineWidth = Math.max(1.5, cell * 0.05);
  ctx.beginPath();
  ctx.moveTo(-cell * 0.12, -cell * 0.05); ctx.lineTo(-cell * 0.12, cell * 0.16);
  ctx.moveTo(cell * 0.12, -cell * 0.05); ctx.lineTo(cell * 0.12, cell * 0.16);
  ctx.stroke();
  // 头
  ctx.fillStyle = "#f4c9a2";
  ctx.beginPath();
  ctx.arc(0, -cell * 0.2, cell * 0.19, 0, Math.PI * 2);
  ctx.fill();
  // 安全帽
  ctx.fillStyle = "#f2b636";
  ctx.beginPath();
  ctx.arc(0, -cell * 0.22, cell * 0.2, Math.PI, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-cell * 0.26, -cell * 0.23, cell * 0.52, Math.max(2, cell * 0.055));
  // 朝向指示（眼睛）
  var dx = vis.dir[0], dy = vis.dir[1];
  ctx.fillStyle = "#2b2b33";
  var er = Math.max(1.2, cell * 0.035);
  var ex = dx * cell * 0.07, ey = dy * cell * 0.05 - cell * 0.16;
  if (dx === 0 && dy === 0) { ex = 0; ey = -cell * 0.16; }
  ctx.beginPath(); ctx.arc(ex - cell * 0.07, ey, er, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex + cell * 0.07, ey, er, 0, Math.PI * 2); ctx.fill();
  // 推箱时伸出的手臂
  if (vis.pushing) {
    ctx.strokeStyle = "#f4c9a2";
    ctx.lineWidth = Math.max(2, cell * 0.08);
    ctx.beginPath();
    ctx.moveTo(-cell * 0.18, cell * 0.02); ctx.lineTo(dx * cell * 0.34 - dy * cell * 0.14, dy * cell * 0.34 + dx * cell * 0.14);
    ctx.moveTo(cell * 0.18, cell * 0.02); ctx.lineTo(dx * cell * 0.34 + dy * cell * 0.14, dy * cell * 0.34 - dx * cell * 0.14);
    ctx.stroke();
  }
  ctx.restore();
}

function render(time) {
  var p0 = cur.p0, x, y;
  for (y = 0; y < p0.h; y++) for (x = 0; x < p0.w; x++) {
    if (p0.walls[y * p0.w + x]) drawWall(x, y); else drawFloor(x, y);
  }
  for (var i = 0; i < p0.goals.length; i++) {
    drawGoal(p0.goals[i] % p0.w, Math.floor(p0.goals[i] / p0.w), time);
  }
  for (var b = 0; b < cur.st.boxes.length; b++) drawBox(b, time);
  drawPlayer(time);
  for (var j = 0; j < particles.length; j++) {
    var pt = particles[j];
    ctx.globalAlpha = Math.max(0, pt.life / 0.7);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function stepVis(dt) {
  var k = 1 - Math.exp(-dt * 16);
  vis.px += (cur.st.px - vis.px) * k;
  vis.py += (cur.st.py - vis.py) * k;
  var w = cur.p0.w, i;
  for (i = 0; i < cur.st.boxes.length; i++) {
    var b = vis.boxes[i];
    var tx = cur.st.boxes[i] % w, ty = Math.floor(cur.st.boxes[i] / w);
    b.x += (tx - b.x) * k;
    b.y += (ty - b.y) * k;
    if (b.sq > 0) b.sq = Math.max(0, b.sq - dt * 5);
  }
  if (vis.bump > 0) vis.bump = Math.max(0, vis.bump - dt * 6);
  // 推箱手臂：玩家正前方一格是箱子时显示
  vis.pushing = false;
  var fx = cur.st.px + vis.dir[0], fy = cur.st.py + vis.dir[1];
  if (fx >= 0 && fy >= 0 && fx < w && fy < cur.p0.h &&
      cur.st.boxes.indexOf(fy * w + fx) >= 0) vis.pushing = true;
  for (var j = particles.length - 1; j >= 0; j--) {
    var pt = particles[j];
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(j, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 260 * dt;
  }
}

var lastT = 0;
function frame(t) {
  var dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  if (view === "play" && cur) {
    stepVis(dt);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    render(t / 1000);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// —— 输入：键盘 ——
document.addEventListener("keydown", function (e) {
  var k = e.key;
  if (k === "m" || k === "M") { toggleMute(); return; }
  if (view === "play") {
    var dir = null;
    if (k === "ArrowUp" || k === "w" || k === "W") dir = "up";
    else if (k === "ArrowDown" || k === "s" || k === "S") dir = "down";
    else if (k === "ArrowLeft" || k === "a" || k === "A") dir = "left";
    else if (k === "ArrowRight" || k === "d" || k === "D") dir = "right";
    if (dir) { e.preventDefault(); doMove(dir); return; }
    if (k === "u" || k === "U") { doUndo(); return; }
    if (k === "r" || k === "R") { restartLevel(true); return; }
    if (k === "Escape") { gotoMenu(); return; }
    if ((k === "Enter" || k === " ") && cur.won) { e.preventDefault(); nextOrMenu(); }
  } else if (view === "menu") {
    if (k === "Enter" || k === " ") {
      e.preventDefault();
      enterLevel(Math.min(save.unlocked, SP_LEVELS.length) - 1);
    }
  }
});

// —— 输入：屏幕方向键（长按连走）+ 画布滑动 ——
function bindPad(id, dir) {
  var el = $(id), iv = 0;
  function start(e) {
    e.preventDefault();
    doMove(dir);
    clearInterval(iv);
    iv = setInterval(function () { doMove(dir); }, 160);
  }
  function stop() { clearInterval(iv); iv = 0; }
  el.addEventListener("touchstart", start, { passive: false });
  el.addEventListener("touchend", stop);
  el.addEventListener("touchcancel", stop);
  el.addEventListener("mousedown", function (e) { e.preventDefault(); doMove(dir); });
  el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}
bindPad("padUp", "up");
bindPad("padDown", "down");
bindPad("padLeft", "left");
bindPad("padRight", "right");

(function () {
  var ts = null;
  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    if (e.touches.length) ts = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchend", function (e) {
    e.preventDefault();
    if (!ts) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - ts.x, dy = t.clientY - ts.y;
    ts = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? "right" : "left");
    else doMove(dy > 0 ? "down" : "up");
  }, { passive: false });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
})();

// —— 按钮 ——
function toggleMute() {
  save.muted = !save.muted;
  persist();
  $("sndBtn").textContent = save.muted ? "SOUND OFF" : "SOUND ON";
  if (!save.muted) SFX.click();
}
$("undoBtn").addEventListener("click", function () { doUndo(); });
$("restartBtn").addEventListener("click", function () { if (cur) restartLevel(true); });
$("menuBtn").addEventListener("click", function () { SFX.click(); gotoMenu(); });
$("nextBtn").addEventListener("click", function () { SFX.click(); nextOrMenu(); });
$("retryBtn").addEventListener("click", function () { if (cur) restartLevel(true); });
$("toMenuBtn").addEventListener("click", function () { SFX.click(); gotoMenu(); });
$("sndBtn").addEventListener("click", toggleMute);

window.addEventListener("resize", function () { if (view === "play") fitCanvas(); });
window.addEventListener("orientationchange", function () { setTimeout(function () { if (view === "play") fitCanvas(); }, 120); });

// —— 启动 ——
$("sndBtn").textContent = save.muted ? "SOUND OFF" : "SOUND ON";
buildMenu();
showView("menu");
// 调试/测试钩子（不影响游戏逻辑）
window.__sp = {
  get view() { return view; },
  get state() { return cur ? cur.st : null; },
  get history() { return cur ? cur.history : null; },
  doMove: doMove,
  doUndo: doUndo
};
</script>
</body>
